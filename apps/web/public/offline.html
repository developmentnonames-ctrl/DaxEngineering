<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1971c2" />
    <title>Offline · DAX Stores</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #1f2933;
        background: #f5f7fa;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: #495057;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: #1971c2;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        DAX Stores needs a connection to show stock and items. Check Wi-Fi or
        mobile data, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
