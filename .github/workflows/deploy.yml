name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {
              name: dax-api,
              file: infra/docker/api.Dockerfile,
              target: api,
              app: '',
            }
          - {
              name: dax-migrate,
              file: infra/docker/api.Dockerfile,
              target: migrate,
              app: '',
            }
          - {
              name: dax-web,
              file: infra/docker/next.Dockerfile,
              target: runtime,
              app: web,
            }
          - {
              name: dax-admin,
              file: infra/docker/next.Dockerfile,
              target: runtime,
              app: admin,
            }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.event.inputs.environment || 'staging' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Trigger Dokploy deployment
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$WEBHOOK" || { echo "DOKPLOY_DEPLOY_WEBHOOK is not set for this environment"; exit 1; }
          curl -fsS -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"ref\":\"${GITHUB_SHA}\"}"
