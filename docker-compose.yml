name: dax-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres-dev-only}
      DAX_DB_NAME: dax
      DAX_MIGRATOR_PASSWORD: ${DAX_MIGRATOR_PASSWORD:-migrator-dev-only}
      DAX_APP_PASSWORD: ${DAX_APP_PASSWORD:-app-dev-only}
      DAX_BACKUP_PASSWORD: ${DAX_BACKUP_PASSWORD:-backup-dev-only}
      DAX_CREATE_SHADOW_DB: 'true'
      TZ: Asia/Colombo
    ports:
      - '127.0.0.1:${DAX_PG_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dax']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dax-dev-only}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dax-dev-only-secret}
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_dax: http://${S3_ACCESS_KEY_ID:-dax-dev-only}:${S3_SECRET_ACCESS_KEY:-dax-dev-only-secret}@minio:9000
      S3_BUCKET: ${S3_BUCKET:-dax-dev}
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc mb --ignore-existing "dax/$$S3_BUCKET" && mc anonymous set none "dax/$$S3_BUCKET"
    restart: 'no'

volumes:
  pgdata:
  miniodata:
